<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PopCraft AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #000000; 
            color: #ffffff; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            background-image: radial-gradient(circle at 10% 20%, rgba(255, 69, 0, 0.3) 0%, rgba(138, 43, 226, 0.15) 30%, transparent 60%);
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        
        /* Header / Navbar */
        header { display: flex; justify-content: space-between; align-items: center; padding: 24px 48px; max-width: 1400px; width: 100%; margin: 0 auto; }
        .logo-img { height: 32px; width: auto; display: block; }
        
        nav { display: flex; gap: 32px; align-items: center; }
        
        /* Dropdown Menu Styling & Animation */
        .dropdown { position: relative; display: inline-block; }
        .dropbtn { cursor: pointer; color: #a1a1a1; font-weight: 600; font-size: 15px; background: none; border: none; font-family: inherit; display: flex; align-items: center; gap: 4px; transition: color 0.2s; }
        .dropdown:hover .dropbtn { color: #fff; }

        .dropdown-content {
            position: absolute;
            top: 130%;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background-color: #ffffff;
            min-width: 140px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 8px 0;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .dropdown:hover .dropdown-content {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .dropdown-content a {
            color: #111111;
            padding: 10px 20px;
            text-decoration: none;
            display: block;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.5px;
            transition: background-color 0.15s ease;
        }

        .dropdown-content a:hover {
            background-color: #f0f0f0;
            color: #000000;
        }

        nav a { color: #a1a1a1; text-decoration: none; font-weight: 600; font-size: 15px; transition: color 0.2s; }
        nav a:hover { color: #ffffff; }

        .hiring-btn { background-color: #5500ff; color: #ffffff; padding: 10px 22px; border-radius: 50px; font-weight: 700; font-size: 13px; text-decoration: none; letter-spacing: 0.5px; transition: transform 0.2s; }
        .hiring-btn:hover { transform: scale(1.05); }

        /* Hero 4-Column Grid Section */
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; max-width: 1250px; margin: 0 auto; width: 100%; }
        .hero-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; width: 100%; }
        
        .grid-card { border-radius: 16px; overflow: hidden; position: relative; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; text-decoration: none; border: 1px solid rgba(255,255,255,0.06); transition: transform 0.2s ease; background-color: #111; }
        .grid-card:hover { transform: translateY(-4px); }
        
        .grid-card img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* Footer */
        footer { max-width: 1200px; width: 100%; margin: 0 auto; padding: 40px 20px; border-top: 1px solid rgba(255, 255, 255, 0.08); display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 20px; color: #888; font-size: 13px; }
        footer a { color: #888; text-decoration: none; display: block; margin-bottom: 8px; transition: color 0.2s; }
        footer a:hover { color: #fff; }
        .footer-logo { height: 24px; width: auto; margin-bottom: 12px; display: block; }
        .footer-bottom-note { grid-column: span 3; text-align: center; margin-top: 20px; color: #555; font-size: 12px; }

        @media (max-width: 1024px) { .hero-grid { grid-template-columns: repeat(2, 1fr); } footer { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <a href="index.html" class="brand-logo">
            <img src="assets/logo/Popcraft_Logotype.png" alt="PopCraft AI" class="logo-img">
        </a>
        <nav>
            <div class="dropdown">
                <button class="dropbtn">DISCOVER ▾</button>
                <div class="dropdown-content">
                    <a href="games.html">GAMES</a>
                    <a href="tools.html">TOOLS</a>
                    <a href="stars.html">STARS</a>
                </div>
            </div>
            <a href="about.html">ABOUT</a>
        </nav>
        <a href="jobs.html" class="hiring-btn">WE'RE HIRING</a>
    </header>

    <!-- Main 4x2 Grid Layout -->
    <main>
        <div class="hero-grid">
            <!-- Row 1 -->
            <div class="grid-card">
                <img src="assets/tiles/BrandedTile1.png" alt="Branded Tile 1">
            </div>
            <a href="games.html" class="grid-card">
                <img src="assets/tiles/Popcraft Games.png" alt="Popcraft Games">
            </a>
            <div class="grid-card">
                <img src="assets/tiles/BrandedTile2.png" alt="Branded Tile 2">
            </div>
            <a href="tools.html" class="grid-card">
                <img src="assets/tiles/Popcraft Tools.png" alt="Popcraft Tools">
            </a>

            <!-- Row 2 -->
            <a href="games.html" class="grid-card">
                <img src="assets/tiles/Temp Assets/Breathe Again - KaiFromSplash Video thumbnail.png" alt="Kai's Video Thumbnail">
            </a>
            <div class="grid-card">
                <img src="assets/tiles/BrandedTile3.png" alt="Branded Tile 3">
            </div>
            <a href="stars.html" class="grid-card">
                <img src="assets/tiles/Popcraft Stars.png" alt="Popcraft Stars">
            </a>
            <div class="grid-card">
                <img src="assets/tiles/BrandedTile4.png" alt="Branded Tile 4">
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div>
            <img src="assets/logo/Popcraft_Logotype.png" alt="PopCraft Logo" class="footer-logo">
            © 2026 PopCraft™. All Rights Reserved.<br><br>
            If you’re interested in getting in touch, reach out via <a href="mailto:info@showtimecraft.org" style="display:inline; color:#aaa;">info@showtimecraft.org</a>
        </div>
        <div>
            <a href="#">Merch</a>
            <a href="#">Newsroom</a>
        </div>
        <div>
            <a href="jobs.html">Careers</a>
            <a href="#">Privacy Policy</a>
            <a href="#">Terms of Use</a>
        </div>
        <div class="footer-bottom-note">
            This Website is hosted live on Cloudflare Pages via <code>popcraft.showtimecraft.org</code>
        </div>
    </footer>

    <script src="logo.js" defer></script>
</body>
</html>
