<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POPCRAFT AI</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="nav-container">
            <!-- Fixed: Set to index.html -->
            <a href="index.html" class="brand-logo">
                <img src="assets/logo/Popcraft_Logotype.png" alt="POPCRAFT AI" class="logo-img">
            </a>
            <div class="nav-right">
                <nav class="nav-menu">
                    <div class="dropdown">
                        <button class="dropbtn">DISCOVER <span class="arrow">▾</span></button>
                        <div class="dropdown-content">
                            <!-- Fixed: Pointed directly to pages -->
                            <a href="games.html">GAMES</a>
                            <a href="#tools">TOOLS</a>
                            <a href="stars.html">STARS</a>
                        </div>
                    </div>
                    <a href="#about" class="nav-link">ABOUT</a>
                </nav>
                <a href="#" class="btn-hiring">WE'RE HIRING</a>
            </div>
        </div>
    </header>

    <!-- Main Grid Landing Area -->
    <main class="hero-container">
        <div class="bento-grid">
            
            <!-- Row 1, Tile 1: Ambient Gradient Asset -->
            <div class="tile tile-gradient-1"></div>

            <!-- Row 1, Tile 2: POPCRAFT GAMES -->
            <!-- Fixed: Wrapped tile content in anchor link -->
            <a href="games.html" class="tile tile-orange">
                <h2>POPCRAFT<br>GAMES</h2>
            </a>

            <!-- Row 1, Tile 3: Ambient Gradient Asset -->
            <div class="tile tile-gradient-2"></div>

            <!-- Row 1, Tile 4: POPCRAFT TOOLS -->
            <div class="tile tile-purple">
                <h2>POPCRAFT<br>TOOLS</h2>
            </div>

            <!-- Row 2, Tile 1: Kai Featured Album Tile -->
            <div class="tile tile-media">
                <img src="assets/tiles/AlbumCover.png" alt="Featured Track">
            </div>

            <!-- Row 2, Tile 2: Ambient Gradient Asset -->
            <div class="tile tile-gradient-3"></div>

            <!-- Row 2, Tile 3: POPCRAFT STARS -->
            <!-- Fixed: Wrapped tile content in anchor link -->
            <a href="stars.html" class="tile tile-pink">
                <h2>POPCRAFT<br>STARS</h2>
            </a>

            <!-- Row 2, Tile 4: Ambient Gradient Asset -->
            <div class="tile tile-gradient-4"></div>

        </div>
    </main>

    <!-- Footer Area -->
    <footer class="footer-container">
        <div class="footer-brand">
            <!-- Fixed: Set footer logo to index.html as well -->
            <a href="index.html">
                <img src="assets/logo/Popcraft_Logotype.png" alt="POPCRAFT AI" class="footer-logo">
            </a>
            <p>&copy; 2026 POPCRAFT AI. All Rights Reserved.</p>
        </div>
        <div class="footer-links">
            <div class="link-col">
                <a href="#">Merch</a>
                <a href="#">Newsroom</a>
            </div>
            <div class="link-col">
                <a href="#">Careers</a>
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Use</a>
            </div>
        </div>
    </footer>

</body>
</html>
