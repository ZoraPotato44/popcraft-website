<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PopCraft AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: #000000; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        
        /* Header / Navbar */
        header { display: flex; justify-content: space-between; align-items: center; padding: 24px 48px; max-width: 1400px; width: 100%; margin: 0 auto; }
        .logo-text { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; color: #ffffff; text-decoration: none; }
        
        nav { display: flex; gap: 32px; align-items: center; }
        .dropdown { position: relative; display: inline-block; cursor: pointer; color: #a1a1a1; font-weight: 600; font-size: 15px; }
        .dropdown:hover { color: #fff; }
        nav a { color: #a1a1a1; text-decoration: none; font-weight: 600; font-size: 15px; transition: color 0.2s; }
        nav a:hover { color: #ffffff; }

        .hiring-btn { background-color: #5500ff; color: #ffffff; padding: 10px 22px; border-radius: 50px; font-weight: 700; font-size: 13px; text-decoration: none; letter-spacing: 0.5px; transition: transform 0.2s; }
        .hiring-btn:hover { transform: scale(1.05); }

        /* Hero Grid Section - Exact 3 columns by 2 rows match */
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; max-width: 1100px; margin: 0 auto; width: 100%; }
        .hero-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; width: 100%; }
        
        .grid-card { border-radius: 16px; overflow: hidden; position: relative; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; text-decoration: none; border: 1px solid rgba(255,255,255,0.06); transition: transform 0.2s ease; background-color: #111; }
        .grid-card:hover { transform: translateY(-4px); }
        
        .grid-card img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* Footer */
        footer { max-width: 1200px; width: 100%; margin: 0 auto; padding: 40px 20px; border-top: 1px solid rgba(255, 255, 255, 0.08); display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 20px; color: #888; font-size: 13px; }
        footer a { color: #888; text-decoration: none; display: block; margin-bottom: 8px; transition: color 0.2s; }
        footer a:hover { color: #fff; }
        .footer-bottom-note { grid-column: span 3; text-align: center; margin-top: 20px; color: #555; font-size: 12px; }

        @media (max-width: 900px) { .hero-grid { grid-template-columns: 1fr; } footer { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <a href="index.html" class="logo-text">POPCRAFT AI</a>
        <nav>
            <div class="dropdown">Discover ▾</div>
            <a href="games.html">Games</a>
            <a href="tools.html">Tools</a>
            <a href="stars.html">Stars</a>
        </nav>
        <a href="#" class="hiring-btn" target="_blank">WE'RE HIRING</a>
    </header>

    <!-- Main Grid Layout matching the 6-card Splash reference -->
    <main>
        <div class="hero-grid">
            <!-- Row 1, Col 1: Non-clickable decorative tile -->
            <div class="grid-card">
                <img src="assets/tiles/BrandedTile1.png" alt="Branded Tile 1">
            </div>

            <!-- Row 1, Col 2: Games -->
            <a href="games.html" class="grid-card">
                <img src="assets/tiles/Popcraft Games.png" alt="Popcraft Games">
            </a>

            <!-- Row 1, Col 3: Tools -->
            <a href="tools.html" class="grid-card">
                <img src="assets/tiles/Popcraft Tools.png" alt="Popcraft Tools">
            </a>

            <!-- Row 2, Col 1: Play / Video Showcase -->
            <a href="games.html" class="grid-card">
                <img src="assets/tiles/play icon.png" alt="Play Showcase">
            </a>

            <!-- Row 2, Col 2: Stars -->
            <a href="stars.html" class="grid-card">
                <img src="assets/tiles/Popcraft Stars.png" alt="Popcraft Stars">
            </a>

            <!-- Row 2, Col 3: Non-clickable decorative tile -->
            <div class="grid-card">
                <img src="assets/tiles/BrandedTile2.png" alt="Branded Tile 2">
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div>
            <div style="font-weight: 700; color: #fff; margin-bottom: 12px;">POPCRAFT</div>
            © 2026 PopCraft. All Rights Reserved.<br><br>
            If you’re interested in getting in touch, reach out via <a href="mailto:info@showtimecraft.org" style="display:inline; color:#aaa;">info@showtimecraft.org</a>
        </div>
        <div>
            <a href="#">Merch</a>
            <a href="#">Newsroom</a>
        </div>
        <div>
            <a href="#">Careers</a>
            <a href="#">Privacy Policy</a>
            <a href="#">Terms of Use</a>
        </div>
        <div class="footer-bottom-note">
            Hosted live on Cloudflare Pages via <code>popcraft.showtimecraft.org</code>
        </div>
    </footer>

</body>
</html>
