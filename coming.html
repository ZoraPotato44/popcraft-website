<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popcraft — Coming Soon</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0b12;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        .coming-soon {
            max-width: 700px;
            padding: 40px 24px;
        }

        .logo {
            width: 180px;
            max-width: 70%;
            margin-bottom: 40px;
        }

        .eyebrow {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.55;
            margin-bottom: 18px;
        }

        h1 {
            font-size: clamp(42px, 8vw, 76px);
            line-height: 1;
            letter-spacing: -3px;
            margin-bottom: 24px;

            background: linear-gradient(
                90deg,
                #ffffff,
                #c084fc,
                #ff6bd6
            );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        p {
            color: #a6a6b3;
            font-size: 17px;
            line-height: 1.7;
        }

        .status {
            display: inline-block;
            margin-top: 32px;
            padding: 10px 18px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 999px;
            color: #d4d4dc;
            font-size: 13px;
        }

        footer {
            position: fixed;
            bottom: 24px;
            left: 0;
            right: 0;
            text-align: center;
            color: #555563;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <main class="coming-soon">

        <img
            src="assets/logo/Popcraft_Logotype.png"
            alt="Popcraft"
            class="logo"
        >

        <div class="eyebrow">
            Popcraft Archive
        </div>

        <h1>Coming Soon.</h1>

        <p>
            We're currently preparing the Popcraft™ archive.
            Check back soon.
        </p>

        <div class="status">
            Site currently under construction
        </div>

    </main>

    <footer>
        © 2026 Popcraft™
    </footer>

</body>
</html>
