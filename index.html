<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POPCRAFT AI</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="brand-logo">
                <img src="assets/logo/Popcraft_Logotype.png" alt="POPCRAFT AI" class="logo-img">
            </a>
            <div class="nav-right">
                <nav class="nav-menu">
                    <div class="dropdown" id="discoverDropdown">
                        <button class="dropbtn" onclick="toggleDropdown('discoverDropdown')">DISCOVER <span class="arrow">▾</span></button>
                        <div class="dropdown-content">
                            <a href="games.html">GAMES</a>
                            <a href="tools.html">TOOLS</a>
                            <a href="stars.html">STARS</a>
                        </div>
                    </div>
                    <a href="#about" class="nav-link">ABOUT</a>
                </nav>
                <a href="#" class="btn-hiring">WE'RE HIRING</a>
            </div>
        </div>
    </header>

    <!-- Bento Grid Landing Section (Original Layout Match) -->
    <main class="hero-container">
        <div class="bento-grid">
            <!-- Row 1 -->
            <div class="tile tile-gradient-1"></div>
            
            <a href="games.html" class="tile tile-text-card">
                <h2>POPCRAFT<br>GAMES</h2>
            </a>
            
            <div class="tile tile-gradient-2"></div>
            
            <a href="tools.html" class="tile tile-text-card">
                <h2>POPCRAFT<br>TOOLS</h2>
            </a>

            <!-- Row 2 -->
            <div class="tile tile-media">
                <img src="assets/tiles/AlbumCover.png" alt="Featured Star">
            </div>

            <div class="tile tile-gradient-3"></div>

            <a href="stars.html" class="tile tile-pink-card">
                <h2>POPCRAFT<br>STARS</h2>
            </a>

            <div class="tile tile-gradient-4"></div>
        </div>
    </main>

    <!-- Footer Area -->
    <footer class="footer-container">
        <div class="footer-brand">
            <a href="index.html">
                <img src="assets/logo/Popcraft_Logotype.png" alt="POPCRAFT AI" class="footer-logo">
            </a>
            <p>&copy; 2026 POPCRAFT AI. All Rights Reserved.</p>
        </div>
        <div class="footer-links">
            <div class="link-col">
                <a href="#">Merch</a>
                <a href="#">Newsroom</a>
            </div>
            <div class="link-col">
                <a href="#">Careers</a>
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Use</a>
            </div>
        </div>
    </footer>

    <script>
        function toggleDropdown(id) {
            const el = document.getElementById(id);
            el.classList.toggle('active');
        }

        window.onclick = function(event) {
            if (!event.target.matches('.dropbtn') && !event.target.matches('.btn-download-main')) {
                const dropdowns = document.getElementsByClassName("dropdown");
                for (let i = 0; i < dropdowns.length; i++) {
                    dropdowns[i].classList.remove('active');
                }
                const downloads = document.getElementsByClassName("download-dropdown-wrapper");
                for (let i = 0; i < downloads.length; i++) {
                    downloads[i].classList.remove('active');
                }
            }
        }
    </script>

</body>
</html>
