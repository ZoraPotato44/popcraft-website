<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Careers - PopCraft AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #000000; 
            color: #ffffff; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            background-image: radial-gradient(circle at 90% 10%, rgba(138, 43, 226, 0.2) 0%, transparent 50%);
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        header { display: flex; justify-content: space-between; align-items: center; padding: 24px 48px; max-width: 1400px; width: 100%; margin: 0 auto; }
        .logo-text { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; color: #ffffff; text-decoration: none; }
        nav { display: flex; gap: 32px; align-items: center; }
        nav a { color: #a1a1a1; text-decoration: none; font-weight: 600; font-size: 15px; transition: color 0.2s; }
        nav a:hover { color: #ffffff; }
        
        main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; text-align: center; max-width: 700px; margin: 0 auto; }
        h1 { font-size: 42px; font-weight: 800; margin-bottom: 16px; letter-spacing: -1px; }
        p { color: #a1a1a1; font-size: 16px; line-height: 1.6; margin-bottom: 32px; }
        .back-btn { background-color: #222; color: #fff; padding: 12px 28px; border-radius: 50px; font-weight: 600; text-decoration: none; border: 1px solid rgba(255,255,255,0.1); transition: background 0.2s; }
        .back-btn:hover { background-color: #333; }

        footer { max-width: 1200px; width: 100%; margin: 0 auto; padding: 30px 20px; text-align: center; color: #555; font-size: 12px; border-top: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo-text">POPCRAFT AI</a>
        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <main>
        <h1>No Open Positions</h1>
        <p>We are currently not in official development for AI initiatives or actively expanding public staff applications. Check back later as our roadmap evolves!</p>
        <a href="index.html" class="back-btn">Return Home</a>
    </main>

    <footer>
        © 2026 PopCraft. All Rights Reserved.
    </footer>
</body>
</html>
